<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JJX ERP 文档中心</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231a73e8'/><text x='16' y='22' font-size='18' text-anchor='middle' fill='white'>J</text></svg>">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

/* Phone frame */
.phone {
  width: 100%;
  max-width: 400px;
  min-height: 700px;
  background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
  border-radius: 36px;
  padding: 20px 16px 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.08);
  position: relative;
}

/* Notch / status bar */
.status-bar {
  display: flex;
  justify-content: space-between;
  padding: 4px 12px 16px;
  color: rgba(255,255,255,.6);
  font-size: 12px;
  font-weight: 500;
}

/* Header */
.app-header {
  text-align: center;
  padding: 8px 0 20px;
}
.app-header .logo {
  width: 56px;
  height: 56px;
  background: linear-gradient(135deg, #1a73e8, #409eff);
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 10px;
  font-size: 26px;
  font-weight: 700;
  color: #fff;
  box-shadow: 0 4px 16px rgba(26,115,232,.4);
}
.app-header h1 {
  color: #fff;
  font-size: 18px;
  font-weight: 600;
}
.app-header p {
  color: rgba(255,255,255,.5);
  font-size: 12px;
  margin-top: 4px;
}

/* Search bar */
.search-bar {
  background: rgba(255,255,255,.08);
  border-radius: 10px;
  padding: 10px 14px;
  margin: 4px 0 20px;
  display: flex;
  align-items: center;
  gap: 8px;
  color: rgba(255,255,255,.35);
  font-size: 13px;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,.06);
}
.search-bar::before { content: '🔍'; font-size: 14px; }

/* App grid */
.app-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px 8px;
  padding: 4px 0;
}

.app-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  transition: transform .15s;
  text-decoration: none;
}
.app-item:hover { transform: translateY(-2px); }
.app-item:active { transform: scale(.93); }

.app-icon {
  width: 56px;
  height: 56px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  box-shadow: 0 4px 12px rgba(0,0,0,.2);
  position: relative;
}
.app-icon .badge {
  position: absolute;
  top: -4px;
  right: -4px;
  min-width: 18px;
  height: 18px;
  border-radius: 9px;
  background: #ea4335;
  color: #fff;
  font-size: 10px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 4px;
}

.app-label {
  color: rgba(255,255,255,.7);
  font-size: 11px;
  text-align: center;
  line-height: 1.3;
}

/* Section divider */
.section-label {
  color: rgba(255,255,255,.35);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .5px;
  padding: 16px 4px 8px;
  border-top: 1px solid rgba(255,255,255,.06);
  margin-top: 4px;
}
.section-label:first-of-type { border-top: none; margin-top: 0; }

/* Dock */
.dock {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 24px;
  padding-top: 16px;
  border-top: 1px solid rgba(255,255,255,.08);
}
.dock .app-icon {
  width: 48px;
  height: 48px;
  font-size: 20px;
}

/* Page indicator dots */
.dots {
  display: flex;
  justify-content: center;
  gap: 6px;
  padding: 16px 0 4px;
}
.dots span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgba(255,255,255,.2);
}
.dots span.active { background: rgba(255,255,255,.6); width: 20px; border-radius: 3px; }
</style>
</head>
<body>

<div class="phone">
  <!-- Status Bar -->
  <div class="status-bar">
    <span>10:54</span>
    <span>📶 🔋</span>
  </div>

  <!-- Header -->
  <div class="app-header">
    <div class="logo">J</div>
    <h1>JJX ERP</h1>
    <p>文档中心</p>
  </div>

  <!-- Search -->
  <div class="search-bar">搜索文档...</div>

  <!-- Section: 核心工具 -->
  <div class="section-label">核心工具</div>
  <div class="app-grid">
    <a class="app-item" href="/tasks/">
      <div class="app-icon" style="background:linear-gradient(135deg,#1a73e8,#4fc3f7)">📋</div>
      <span class="app-label">任务看板</span>
    </a>
    <a class="app-item" href="/test/">
      <div class="app-icon" style="background:linear-gradient(135deg,#34a853,#81c784)">🧪</div>
      <span class="app-label">测试工作台</span>
    </a>
    <a class="app-item" href="/flows/biz-flow.html">
      <div class="app-icon" style="background:linear-gradient(135deg,#ea4335,#ef9a9a)">🔄</div>
      <span class="app-label">业务流程</span>
    </a>
    <a class="app-item" href="/accounts/">
      <div class="app-icon" style="background:linear-gradient(135deg,#ff8f00,#ffd54f)">🔑</div>
      <span class="app-label">账号密码</span>
    </a>
  </div>

  <!-- Section: 文档 -->
  <div class="section-label">文档</div>
  <div class="app-grid">
    <a class="app-item" href="/flows/biz-flow.html">
      <div class="app-icon" style="background:linear-gradient(135deg,#9c27b0,#ce93d8)">📊</div>
      <span class="app-label">业务流程图</span>
    </a>
    <a class="app-item" href="/requirements/product-stock-requirement.html">
      <div class="app-icon" style="background:linear-gradient(135deg,#0d9488,#5eead4)">📦</div>
      <span class="app-label">产品库存需求</span>
    </a>
    <a class="app-item" onclick="editTestPlan()">
      <div class="app-icon" style="background:linear-gradient(135deg,#607d8b,#90a4ae)">📝</div>
      <span class="app-label">测试计划</span>
    </a>
  </div>

  <!-- Section: 外部链接 -->
  <div class="section-label">快速跳转</div>
  <div class="app-grid">
    <a class="app-item" href="http://localhost:3000" target="_blank">
      <div class="app-icon" style="background:linear-gradient(135deg,#ff5722,#ff8a65)">🖥️</div>
      <span class="app-label">ERP前台</span>
    </a>
    <a class="app-item" href="http://localhost:8080/doc.html" target="_blank">
      <div class="app-icon" style="background:linear-gradient(135deg,#009688,#80cbc4)">📖</div>
      <span class="app-label">API文档</span>
    </a>
    <a class="app-item" href="https://github.com/HelloLeoLyn/jjx" target="_blank">
      <div class="app-icon" style="background:linear-gradient(135deg,#222,#555)">💻</div>
      <span class="app-label">GitHub</span>
    </a>
  </div>

  <!-- Dock -->
  <div class="dock">
    <a class="app-item" href="/tasks/">
      <div class="app-icon" style="background:linear-gradient(135deg,#1a73e8,#4fc3f7);width:48px;height:48px">📋</div>
    </a>
    <a class="app-item" href="/test/">
      <div class="app-icon" style="background:linear-gradient(135deg,#34a853,#81c784);width:48px;height:48px">🧪</div>
    </a>
    <a class="app-item" href="http://localhost:3000" target="_blank">
      <div class="app-icon" style="background:linear-gradient(135deg,#ff5722,#ff8a65);width:48px;height:48px">🖥️</div>
    </a>
  </div>

  <!-- Dots -->
  <div class="dots">
    <span class="active"></span>
    <span></span>
  </div>
</div>

<script>
function editTestPlan() {
  alert('测试计划文档：tests/test-plan-table.md');
}
</script>
</body>
</html>
