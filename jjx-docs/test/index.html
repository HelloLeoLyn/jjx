<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERP 测试工作台 v2.0</title>
<!-- SortableJS -->
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --sidebar-w: 240px;
  --primary: #1a73e8;
  --success: #34a853;
  --danger: #ea4335;
  --warning: #fbbc04;
  --gray: #5f6368;
  --bg: #f8f9fa;
  --card-bg: #fff;
  --border: #dadce0;
  --new: #9334e6;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: #202124;
  height: 100vh;
  overflow: hidden;
}

/* Header */
.header {
  background: var(--primary);
  color: #fff;
  padding: 12px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  height: 52px;
}
.header h1 { font-size: 18px; font-weight: 600; }
.header .version { font-size: 11px; opacity: .65; background: rgba(255,255,255,.15); padding: 2px 8px; border-radius: 8px; }
.header .stats { font-size: 13px; opacity: .85; margin-left: auto; }

/* Layout */
.layout { display: flex; height: calc(100vh - 52px); }

/* Sidebar */
.sidebar {
  width: var(--sidebar-w);
  background: var(--card-bg);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  flex-shrink: 0;
}
.sidebar .section-title {
  padding: 14px 16px 6px;
  font-size: 11px;
  font-weight: 600;
  color: var(--gray);
  text-transform: uppercase;
  letter-spacing: .5px;
}
.module-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  cursor: pointer;
  font-size: 13px;
  border-left: 3px solid transparent;
  transition: all .15s;
}
.module-item:hover { background: #f1f3f4; }
.module-item.active {
  background: #e8f0fe;
  border-left-color: var(--primary);
  color: var(--primary);
  font-weight: 500;
}
.module-item .badge {
  margin-left: auto;
  font-size: 11px;
  padding: 1px 7px;
  border-radius: 10px;
  background: #f1f3f4;
  color: var(--gray);
  white-space: nowrap;
}
.module-item .badge.pass { background: #e6f4ea; color: #1e7e34; }
.module-item .badge.fail { background: #fce8e6; color: #c5221f; }
.module-item .badge.partial { background: #fef7e0; color: #b06000; }
.module-item .code-badge {
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 8px;
  margin-right: 2px;
}
.module-item .code-badge.existing { background: #e6f4ea; color: #1e7e34; }
.module-item .code-badge.new { background: #f3e8fd; color: #7c3aed; }
.module-item .code-badge.partial { background: #fef7e0; color: #b06000; }

/* Main content */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Toolbar */
.toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 24px;
  background: var(--card-bg);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.toolbar .module-title { font-size: 16px; font-weight: 600; }
.toolbar .module-desc { font-size: 12px; color: var(--gray); margin-left: 8px; }
.toolbar .code-status {
  font-size: 11px;
  padding: 2px 10px;
  border-radius: 8px;
  margin-left: 8px;
}
.toolbar .code-status.existing { background: #e6f4ea; color: #1e7e34; }
.toolbar .code-status.new { background: #f3e8fd; color: #7c3aed; }
.toolbar .code-status.partial { background: #fef7e0; color: #b06000; }
.filter-btn {
  padding: 5px 14px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: #fff;
  cursor: pointer;
  font-size: 12px;
  transition: all .15s;
}
.filter-btn:hover { background: #f1f3f4; }
.filter-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.filter-btn.pass-count { color: var(--gray); margin-left: auto; cursor: default; border: none; }

/* Case list */
.case-list {
  flex: 1;
  overflow-y: auto;
  padding: 16px 24px 80px;
}

/* Case card */
.case-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
  margin-bottom: 8px;
  cursor: grab;
  transition: box-shadow .15s;
}
.case-card:hover { box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.case-card:active { cursor: grabbing; }
.case-card.sortable-chosen { box-shadow: 0 4px 12px rgba(0,0,0,.12); }
.case-card.sortable-ghost { opacity: .4; }

.case-header {
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.case-id {
  font-size: 11px;
  font-weight: 600;
  color: var(--gray);
  background: #f1f3f4;
  padding: 2px 8px;
  border-radius: 4px;
  white-space: nowrap;
  margin-top: 1px;
}
.case-title {
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  flex: 1;
}
.case-status {
  font-size: 11px;
  padding: 2px 10px;
  border-radius: 10px;
  white-space: nowrap;
}
.case-status.todo { background: #f1f3f4; color: var(--gray); }
.case-status.pass { background: #e6f4ea; color: #1e7e34; }
.case-status.fail { background: #fce8e6; color: #c5221f; }
.case-status.blocked { background: #fef7e0; color: #b06000; }

/* Code status tag on case card */
.code-tag {
  font-size: 10px;
  padding: 1px 7px;
  border-radius: 8px;
  margin-left: 8px;
  white-space: nowrap;
}
.code-tag.existing { background: #e6f4ea; color: #1e7e34; }
.code-tag.new { background: #f3e8fd; color: #7c3aed; }
.code-tag.partial { background: #fef7e0; color: #b06000; }

/* Case details (collapsible) */
.case-details {
  display: none;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}
.case-card.expanded .case-details { display: block; }
.detail-row { font-size: 13px; margin-bottom: 6px; color: #444; }
.detail-row strong { color: #202124; }
.detail-row pre {
  display: inline;
  font-family: inherit;
  color: #444;
}

/* Actions */
.case-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
  flex-wrap: wrap;
}
.btn {
  padding: 5px 14px;
  border: none;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
  transition: all .15s;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: #1557b0; }
.btn-success { background: var(--success); color: #fff; }
.btn-success:hover { background: #2d8f47; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { background: #b3261e; }
.btn-warning { background: var(--warning); color: #202124; }
.btn-warning:hover { background: #e6a800; }
.btn-outline { background: #fff; border: 1px solid var(--border); color: var(--gray); }
.btn-outline:hover { background: #f1f3f4; }
.btn-sm { padding: 3px 10px; font-size: 11px; }

/* 截图管理弹窗 */
.ss-modal {
  position:fixed; top:0; left:0; right:0; bottom:0;
  background:rgba(0,0,0,.5); z-index:9998;
  display:flex; align-items:center; justify-content:center;
}
.ss-modal-box {
  background:var(--card-bg); border-radius:12px;
  width:640px; max-width:90vw; max-height:85vh;
  display:flex; flex-direction:column;
  box-shadow:0 8px 32px rgba(0,0,0,.3);
}
.ss-modal-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 20px; border-bottom:1px solid var(--border);
  font-size:15px; font-weight:600;
}
.ss-modal-close {
  font-size:20px; cursor:pointer; color:var(--gray); line-height:1;
  padding:0 4px;
}
.ss-modal-close:hover { color:#202124; }

/* 粘贴区域 */
.ss-paste-zone {
  margin:16px 20px; padding:32px 16px;
  border:2px dashed var(--border); border-radius:8px;
  text-align:center; cursor:pointer;
  transition:all .15s;
  background:#fafafa;
}
.ss-paste-zone:hover, .ss-paste-zone.drag-over {
  border-color:var(--primary); background:#e8f0fe;
}
.ss-paste-zone .icon { font-size:36px; color:var(--gray); }
.ss-paste-zone .text { font-size:13px; color:var(--gray); margin-top:6px; }
.ss-paste-zone .sub { font-size:11px; color:#999; margin-top:4px; }
.ss-paste-zone input[type="file"] { display:none; }

/* 截图网格 */
.ss-grid {
  display:flex; flex-wrap:wrap; gap:10px;
  padding:0 20px 16px; overflow-y:auto; flex:1;
  min-height:80px; align-content:flex-start;
}
.ss-item {
  position:relative; width:120px; height:90px; border-radius:6px;
  overflow:hidden; border:1.5px solid var(--border); cursor:pointer;
  flex-shrink:0;
}
.ss-item:hover { border-color:var(--primary); }
.ss-item img { width:100%; height:100%; object-fit:cover; display:block; }
.ss-del {
  position:absolute; top:4px; right:4px; width:20px; height:20px;
  border-radius:50%; background:var(--danger); color:#fff;
  font-size:13px; line-height:20px; text-align:center; cursor:pointer;
  display:none; z-index:2;
  box-shadow:0 1px 3px rgba(0,0,0,.3);
}
.ss-item:hover .ss-del { display:block; }

/* 截图预览弹窗 */
.preview-overlay {
  position:fixed; top:0; left:0; right:0; bottom:0;
  background:rgba(0,0,0,.75); z-index:9999;
  display:flex; align-items:center; justify-content:center;
  cursor:zoom-out;
}
.preview-overlay img {
  max-width:90vw; max-height:90vh;
  border-radius:8px; box-shadow:0 8px 32px rgba(0,0,0,.5);
  cursor:default;
}
.preview-close {
  position:fixed; top:16px; right:24px;
  color:#fff; font-size:28px; cursor:pointer;
  opacity:.7; transition:opacity .15s;
}
.preview-close:hover { opacity:1; }

.notes-input {
  font-size: 12px;
  padding: 3px 8px;
  border: 1px solid var(--border);
  border-radius: 4px;
  width: 160px;
  outline: none;
}
.notes-input:focus { border-color: var(--primary); }
.notes-textarea {
  font-size: 12px;
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: 4px;
  width: 320px;
  min-height: 44px;
  resize: vertical;
  outline: none;
  font-family: inherit;
  line-height: 1.5;
}

.dep-warn {
  font-size: 11px;
  color: var(--danger);
  background: #fce8e6;
  padding: 3px 10px;
  border-radius: 4px;
  margin-top: 4px;
}

/* Report panel */
.report-panel {
  position: fixed;
  bottom: 0;
  left: var(--sidebar-w);
  right: 0;
  background: var(--card-bg);
  border-top: 1px solid var(--border);
  padding: 8px 24px;
  display: flex;
  align-items: center;
  gap: 20px;
  font-size: 12px;
  z-index: 10;
}
.report-panel .stat-item { display: flex; align-items: center; gap: 4px; }
.report-panel .stat-dot { width: 8px; height: 8px; border-radius: 50%; }
.report-panel .reset-btn {
  margin-left: auto;
  padding: 3px 12px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: #fff;
  cursor: pointer;
  font-size: 11px;
  color: var(--gray);
}
.report-panel .reset-btn:hover { background: #f1f3f4; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #aaa; }

@media (max-width: 768px) {
  .sidebar { display: none; }
  .report-panel { left: 0; }
}
</style>
</head>
<body>

<div class="header">
  <h1>🧪 ERP 测试工作台</h1>
  <span class="version">v2.0</span>
  <div class="stats" id="headerStats">加载中...</div>
</div>

<div class="layout">
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar"></div>

  <!-- Main -->
  <div class="main">
    <div class="toolbar" id="toolbar"></div>
    <div class="case-list" id="caseList"></div>
  </div>
</div>

<div class="report-panel" id="reportPanel">
  <div class="stat-item"><span class="stat-dot" style="background:#f1f3f4"></span> 待测: <strong id="statTodo">0</strong></div>
  <div class="stat-item"><span class="stat-dot" style="background:#34a853"></span> 通过: <strong id="statPass">0</strong></div>
  <div class="stat-item"><span class="stat-dot" style="background:#ea4335"></span> 失败: <strong id="statFail">0</strong></div>
  <div class="stat-item"><span class="stat-dot" style="background:#fbbc04"></span> 阻塞: <strong id="statBlocked">0</strong></div>
  <div class="stat-item">通过率: <strong id="statRate">0%</strong></div>
  <button class="reset-btn" onclick="resetAll()">🔄 重置所有状态</button>
</div>

<script>
// ==================== 测试数据 (v2.0 按真实业务流重写) ====================
// codeStatus: 'existing' = ✅ 已有, 'new' = ⚠️ 新模块, 'partial' = ⚠️ 部分待开发
const MODULES = [
  {
    id: 'phase1-inquiry',
    name: 'P1 客户询价',
    desc: '客户提交需求 → 销售录入询价单 → 转报价',
    deps: [],
    codeStatus: 'new',
    cases: [
      { id: 1,  title: '创建询价单',                  pre: '客户已建', steps: '①销售→询价→②新增→③选客户→④填需求/规格/数量/类型→⑤上传图纸→⑥保存', expect: '询价单生成，状态=草稿，操作日志写入(bizType=INQUIRY)' },
      { id: 2,  title: '询价单编辑',                  pre: '询价单已存在', steps: '①勾选询价单→②编辑→③修改内容→④保存', expect: '字段更新，操作日志写入' },
      { id: 3,  title: '询价单搜索/筛选',             pre: '有询价数据', steps: '①按客户名/单号/日期/状态搜索', expect: '搜索结果正确，空数据不报错' },
      { id: 4,  title: '询价→报价转换',              pre: '询价单状态=草稿', steps: '①勾选询价单→②点"转为报价"→③自动跳转报价页预填', expect: '新报价单创建，客户/需求预填，自动带出产品/数量/技术要求明细（8-05 DEV-588：标准品映射产品/按键数/连接器，长文本进自定义要求，单价0待定价），询价单状态=converted，操作日志写入' },
      { id: 143, title: '询价日期范围筛选',            pre: '有询价数据', steps: '①询价列表→②选日期范围→③搜索', expect: '仅返回范围内询价单（8-05 DEV-590修复：startDate/endDate 后端生效，不再静默失效）' },
      { id: 144, title: '已转报价询价单禁删',          pre: '询价单状态=已转报价(3)', steps: '①勾选已转报价询价单→②点删除', expect: '删除按钮禁用+提示"已转报价不能删除"，后端拦截（8-05 前后端双防）' },
      { id: 150, title: '询价转报价通知销售',         pre: '询价单状态=草稿', steps: '①询价单→②转报价', expect: '报价单生成+自动通知销售负责人"补全明细并定价"（8-05 DEV-592）' },
      { id: 151, title: '询价发送',                  pre: '询价单状态=草稿/待处理', steps: '①询价列表→②行操作点"发送"→③确认', expect: '状态 0/1→已发送(2)，发送按钮消失，出现确认/拒绝按钮（8-05 DEV-589）' },
      { id: 152, title: '询价客户确认',              pre: '询价单状态=已发送(2)', steps: '①询价列表→②行操作点"确认"→③确认弹窗', expect: '状态 2→已确认(4)（8-05 DEV-589）' },
      { id: 153, title: '询价客户拒绝',              pre: '询价单状态=已发送(2)', steps: '①询价列表→②行操作点"拒绝"→③填原因→④确认', expect: '状态 2→已拒绝(5)，拒绝原因为必填（8-05 DEV-589）' },
      { id: 154, title: '询价/报价过期定时',          pre: '有超期未处理单据', steps: '①造数据：报价单 valid_until<今天且状态∈(0,1,5,8)，询价单 inquiry_date<90天前且状态∈(0,1,2)→②等待凌晨1:30/1:35定时任务', expect: '报价单→已过期(4)，询价单→已过期(6)；已确认/已完成/已拒绝不被动（8-05 DEV-589）' },
      { id: 145, title: '询价选产品远程搜索+规格回填',  pre: '产品库有数据', steps: '①新增询价→②标准品→③下拉输入关键字搜索→④选中产品', expect: '下拉按关键字实时搜索（不再只加载前100条），选中后描述带出+规格自动回填尺寸/材质/线路/连接器，不覆盖手填内容（8-05 DEV-590）' },
    ]
  },  {
    id: 'phase2-quotation',
    name: 'P2 报价管理',
    desc: '基于询价/直接报价 → 审核 → 发送 → 客户确认 → 转订单/样品',
    deps: ['phase1-inquiry'],
    codeStatus: 'existing',
    cases: [
      { id: 5,  title: '从询价单创建报价',            pre: '询价单已建', steps: '①询价单→转报价→②核对预填信息→③添加明细/单价→④保存', expect: '报价单生成，关联询价单ID，状态=DRAFT，操作日志写入' },
      { id: 6,  title: '直接新增报价单',              pre: '客户已建', steps: '①销售→报价→②新增→③客户下拉聚焦显示全部→输入关键字搜索→④选产品/数量/单价/币种→⑤保存', expect: '报价单写入，列表可见，操作日志写入；报价单号自动生成(QT前缀，8-05 DEV-601修复)；客户下拉聚焦有数据、关键字可搜（8-05修复：原代码调不存在的 customerApi.list）' },
      { id: 7,  title: '报价单复制',                  pre: '报价单已存在', steps: '①勾选报价单→②点复制→③新报价单自动生成', expect: '新报价单创建，状态=DRAFT，内容与源单一致，操作日志写入' },
      { id: 8,  title: '报价提交审核',                pre: '状态=DRAFT', steps: '①勾选→②点"提交审核"', expect: '状态→pending_review，操作日志写入（8-05修正：不通知审核人，审核人由人工查待办）' },

// ==================== 状态管理 ====================
const STATUSES = { TODO: 'todo', PASS: 'pass', FAIL: 'fail', BLOCKED: 'blocked' };
const STORAGE_KEY = 'erp_test_state_v2';
const ORDER_KEY = 'erp_test_order_v2';

function loadState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; }
}
function saveState(state) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function loadOrder() {
  try { return JSON.parse(localStorage.getItem(ORDER_KEY)) || {}; } catch { return {}; }
}
function saveOrder(order) {
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
}

function getState(id) {
  const s = loadState();
  return s[id] || { status: STATUSES.TODO, notes: '', screenshots: [] };
}

function setState(id, data) {
  const s = loadState();
  s[id] = { ...getState(id), ...data };
  saveState(s);
  renderAll();
}

// ==================== 渲染 ====================
let currentModule = 0;
let filterMode = 'all';

function getCasesForModule(mi) {
  const order = loadOrder();
  const mod = MODULES[mi];
  const key = mod.id;
  if (order[key] && Array.isArray(order[key])) {
    return order[key].map(id => mod.cases.find(c => c.id === id)).filter(Boolean);
  }
  return [...mod.cases];
}

function renderSidebar() {
  const el = document.getElementById('sidebar');
  let html = '<div class="section-title">📋 测试模块</div>';
  MODULES.forEach((mod, i) => {
    const state = loadState();
    const done = mod.cases.filter(c => (state[c.id]?.status) === STATUSES.PASS).length;
    const total = mod.cases.length;
    const active = i === currentModule ? 'active' : '';
    let badgeClass = '';
    if (done === total && total > 0) badgeClass = 'pass';
    else if (done > 0) badgeClass = 'partial';
    if (done === 0) badgeClass = '';

    let codeBadgeHtml = '';
    if (mod.codeStatus === 'new') {
      codeBadgeHtml = '<span class="code-badge new">🆕</span>';
    } else if (mod.codeStatus === 'existing') {
      codeBadgeHtml = '<span class="code-badge existing">✅</span>';
    } else if (mod.codeStatus === 'partial') {
      codeBadgeHtml = '<span class="code-badge partial">⚠️</span>';
    }

    html += `<div class="module-item ${active}" onclick="switchModule(${i})">
      <span>${done === total ? '✅' : done > 0 ? '⏳' : '⬜'}</span>
      ${codeBadgeHtml}
      <span>${mod.name}</span>
      <span class="badge ${badgeClass}">${done}/${total}</span>
    </div>`;
  });
  el.innerHTML = html;
}

function switchModule(i) {
  currentModule = i;
  filterMode = 'all';
  renderAll();
}

function renderToolbar() {
  const mod = MODULES[currentModule];
  const el = document.getElementById('toolbar');
  const cases = getCasesForModule(currentModule);
  const state = loadState();
  const all = cases.length;
  const pass = cases.filter(c => state[c.id]?.status === STATUSES.PASS).length;

  let codeStatusHtml = '';
  const codeLabel = { 'new': '🆕 新模块', 'existing': '✅ 已有', 'partial': '⚠️ 部分待开发' };
  if (mod.codeStatus) {
    codeStatusHtml = `<span class="code-status ${mod.codeStatus}">${codeLabel[mod.codeStatus]}</span>`;
  }

  el.innerHTML = `
    <span class="module-title">${mod.name}</span>
    <span class="module-desc">${mod.desc}</span>
    ${codeStatusHtml}
    <span style="flex:1"></span>
    <button class="filter-btn ${filterMode === 'all' ? 'active' : ''}" onclick="setFilter('all')">全部 (${all})</button>
    <button class="filter-btn ${filterMode === 'todo' ? 'active' : ''}" onclick="setFilter('todo')">待测</button>
    <button class="filter-btn ${filterMode === 'pass' ? 'active' : ''}" onclick="setFilter('pass')">通过 (${pass})</button>
    <button class="filter-btn ${filterMode === 'fail' ? 'active' : ''}" onclick="setFilter('fail')">失败</button>
    <button class="filter-btn ${filterMode === 'blocked' ? 'active' : ''}" onclick="setFilter('blocked')">阻塞</button>
  `;
}

function renderCaseList() {
  const mod = MODULES[currentModule];
  const el = document.getElementById('caseList');
  const cases = getCasesForModule(currentModule);
  const state = loadState();
  const deps = mod.deps || [];

  // Check dependency warnings
  const depWarnings = [];
  deps.forEach(depId => {
    const depMod = MODULES.find(m => m.id === depId);
    if (depMod) {
      const allDepPass = depMod.cases.every(c => state[c.id]?.status === STATUSES.PASS);
      if (!allDepPass) {
        depWarnings.push(`⚠️ 前置模块 "${depMod.name}" 尚有未通过的用例`);
      }
    }
  });

  let filtered = cases;
  if (filterMode !== 'all') {
    filtered = cases.filter(c => (state[c.id]?.status || STATUSES.TODO) === filterMode);
  }

  let html = '';

  if (depWarnings.length > 0) {
    html = depWarnings.map(w => `<div class="dep-warn" style="margin-bottom:8px">${w}</div>`).join('');
  }

  if (filtered.length === 0) {
    html += '<div style="text-align:center;padding:40px;color:var(--gray)">没有匹配的用例</div>';
    el.innerHTML = html;
    return;
  }

  html += `<div id="sortableList">`;
  const codeLabel = { 'new': '🆕需开发', 'existing': '✅已有', 'partial': '⚠️待完善' };
  filtered.forEach(c => {
    const s = state[c.id] || { status: STATUSES.TODO, notes: '', screenshots: [] };
    const statusLabel = { todo: '待测', pass: '通过', fail: '失败', blocked: '阻塞' };
    const exp = c.expect || '';

    let codeTagHtml = '';
    if (c.codeStatus && c.codeStatus !== 'existing') {
      codeTagHtml = `<span class="code-tag ${c.codeStatus}">${codeLabel[c.codeStatus]}</span>`;
    }

    html += `
      <div class="case-card" data-id="${c.id}">
        <div class="case-header">
          <span class="case-id">#${c.id}</span>
          <span class="case-title" onclick="toggleExpand(event, ${c.id})">${c.title}${codeTagHtml}</span>
          <span class="case-status ${s.status}">${statusLabel[s.status] || '待测'}</span>
        </div>
        <div class="case-details">
          <div class="detail-row"><strong>前置条件：</strong>${c.pre || '-'}</div>
          <div class="detail-row"><strong>操作步骤：</strong>${c.steps || '-'}</div>
          <div class="detail-row"><strong>预期结果：</strong><pre>${exp}</pre></div>
          <div class="case-actions">
            <button class="btn btn-outline btn-sm" onclick="event.stopPropagation();copyCaseDetail(${c.id}, this)">📋 复制详情</button>
            <button class="btn btn-success btn-sm" onclick="event.stopPropagation();setStatus(${c.id},'pass')">✅ 通过</button>
            <button class="btn btn-danger btn-sm" onclick="event.stopPropagation();setStatus(${c.id},'fail')">❌ 失败</button>
            <button class="btn btn-warning btn-sm" onclick="event.stopPropagation();setStatus(${c.id},'blocked')">⛔ 阻塞</button>
            <button class="btn btn-outline btn-sm" onclick="event.stopPropagation();setStatus(${c.id},'todo')">↩ 待测</button>
            ${s.status === 'fail' && !s.linkedTask ? `<button class="btn btn-danger btn-sm" onclick="event.stopPropagation();openTaskForm(${c.id})">➕ 登记任务</button>` : ''}
            ${s.linkedTask ? `<button class="btn btn-info btn-sm" onclick="event.stopPropagation();viewLinkedTask()">🔗 ${s.linkedTask.taskCode}</button>` : ''}
            <button class="btn btn-primary btn-sm" onclick="event.stopPropagation();openScreenshotManager(${c.id})">📷 截图 (${(s.screenshots||[]).length})</button>
            <textarea class="notes-textarea" placeholder="备注（失败现象/复现步骤/环境等，登记任务时自动带入）..." rows="2" onchange="event.stopPropagation();setNotes(${c.id},this.value)" onclick="event.stopPropagation()">${(s.notes || '').replace(/&/g, '&amp;').replace(/</g, '&lt;')}</textarea>
          </div>
        </div>
      </div>`;
  });
  html += `</div>`;
  el.innerHTML = html;

  // Init sortable
  const sortableEl = document.getElementById('sortableList');
  if (sortableEl) {
    Sortable.create(sortableEl, {
      animation: 150,
      handle: '.case-card',
      onEnd: function(evt) {
        const items = Array.from(evt.from.children).map(el => parseInt(el.dataset.id));
        const order = loadOrder();
        order[MODULES[currentModule].id] = items;
        saveOrder(order);
      }
    });
  }

  // Render screenshots for all visible cards
  filtered.forEach(c => {
    renderScreenshots(c.id);
  });
}

function renderStats() {
  const state = loadState();
  let todo = 0, pass = 0, fail = 0, blocked = 0;
  MODULES.forEach(m => m.cases.forEach(c => {
    const s = state[c.id] || { status: STATUSES.TODO };
    if (s.status === STATUSES.PASS) pass++;
    else if (s.status === STATUSES.FAIL) fail++;
    else if (s.status === STATUSES.BLOCKED) blocked++;
    else todo++;
  }));
  const total = todo+pass+fail+blocked;
  const rate = total > 0 ? Math.round(pass/total*100) : 0;
  document.getElementById('statTodo').textContent = todo;
  document.getElementById('statPass').textContent = pass;
  document.getElementById('statFail').textContent = fail;
  document.getElementById('statBlocked').textContent = blocked;
  document.getElementById('statRate').textContent = rate + '%';
  document.getElementById('headerStats').textContent = `通过 ${pass}/${total} · 通过率 ${rate}%`;
}

function renderAll() {
  renderSidebar();
  renderToolbar();
  renderCaseList();
  renderStats();
}

// ==================== 操作函数 ====================
function toggleExpand(e, id) {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target.tagName === 'LABEL') return;
  const card = document.querySelector(`.case-card[data-id="${id}"]`);
  if (card) card.classList.toggle('expanded');
}

// 复制用例详情（标题/前置/步骤/预期）
function copyCaseDetail(id, btn) {
  const c = MODULES.flatMap(m => m.cases).find(x => x.id === id);
  if (!c) return;
  const exp = (c.expect || '-').replace(/<[^>]+>/g, '');
  const text = [
    `【TC-${c.id}】${c.title}`,
    `前置条件：${c.pre || '-'}`,
    `操作步骤：${c.steps || '-'}`,
    `预期结果：${exp}`,
  ].join('\n');
  const done = () => {
    if (btn) {
      const old = btn.textContent;
      btn.textContent = '✅ 已复制';
      setTimeout(() => { btn.textContent = old; }, 1500);
    }
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); } catch (e) {}
  document.body.removeChild(ta);
}

function setStatus(id, status) {
  setState(id, { status });
  renderAll();
}

function setNotes(id, notes) {
  setState(id, { notes });
}

        <label style="font-size:12px;color:var(--gray)">优先级</label>
        <select id="taskPriority" class="notes-input" style="width:100%;margin-bottom:14px">
          <option value="normal">normal</option>
          <option value="high">high</option>
          <option value="urgent">urgent</option>
          <option value="low">low</option>
        </select>
        <div style="text-align:right">
          <button class="btn btn-outline btn-sm" onclick="closeTaskModal()">取消</button>
          <button class="btn btn-danger btn-sm" onclick="submitTaskForm()">提交登记</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(overlay);
}

function closeTaskModal() {
  const el = document.getElementById('taskModal');
  if (el) el.remove();
}

async function submitTaskForm() {
  const title = document.getElementById('taskTitle').value.trim();
  const desc = document.getElementById('taskDesc').value.trim();
  const priority = document.getElementById('taskPriority').value;
  if (!title) { alert('标题不能为空'); return; }
  try {
    const resp = await fetch('/api/test-task', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, description: desc, priority, tcId: _taskFormId }),
    });
    const r = await resp.json();
    if (r.code !== 0) { alert('登记失败：' + (r.message || '未知错误')); return; }
    setState(_taskFormId, { linkedTask: r.data });
    closeTaskModal();
  } catch (e) {
    alert('登记失败：' + e.message);
  }
}

function viewLinkedTask() {
  window.open('/tasks/', '_blank');
}

function handleScreenshot(e, id) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    const s = getState(id);
    if (!s.screenshots) s.screenshots = [];
    s.screenshots.push(ev.target.result);
    setState(id, { screenshots: s.screenshots });
    renderScreenshots(id);
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

let _ssCurrentId = null;

function openScreenshotManager(id) {
  _ssCurrentId = id;
  const s = getState(id);
  const imgs = (s.screenshots || []).map((src, i) =>
    `<div class="ss-item" onclick="event.stopPropagation();openPreview('${src}')">
      <span class="ss-del" onclick="event.stopPropagation();_removeSs(${i})">✕</span>
      <img src="${src}">
    </div>`
  ).join('');

  const overlay = document.createElement('div');
  overlay.className = 'ss-modal';
  overlay.id = 'ssModal';
  overlay.onclick = function(e) { if (e.target === overlay) closeSsModal(); };
  overlay.innerHTML = `
    <div class="ss-modal-box" onclick="event.stopPropagation()">
      <div class="ss-modal-header">
        <span>📷 截图管理</span>
        <span class="ss-modal-close" onclick="closeSsModal()">✕</span>
      </div>
      <div class="ss-paste-zone" id="ssPasteZone">
        <div class="icon">📋</div>
        <div class="text">点击选择文件 或 Ctrl+V 粘贴截图</div>
        <div class="sub">支持 PNG / JPG / WEBP</div>
        <input type="file" accept="image/*" multiple id="ssFileInput">
      </div>
      <div class="ss-grid" id="ssGrid">${imgs}</div>
    </div>`;
  document.body.appendChild(overlay);

  // 粘贴
  document.addEventListener('paste', _ssPasteHandler);
  // 选择文件
  document.getElementById('ssFileInput').onchange = function(e) {
    for (const file of e.target.files) {
      if (file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = function(ev) { _addSs(ev.target.result); };
        reader.readAsDataURL(file);
      }
    }
    e.target.value = '';
  };
  // 点击粘贴区触发文件选择
  document.getElementById('ssPasteZone').onclick = function() {
    document.getElementById('ssFileInput').click();
  };
}

function _ssPasteHandler(e) {
  for (const item of (e.clipboardData?.items || [])) {
    if (item.type.startsWith('image/')) {
      e.preventDefault();
      const file = item.getAsFile();
      if (!file) continue;
      const reader = new FileReader();
      reader.onload = function(ev) { _addSs(ev.target.result); };
      reader.readAsDataURL(file);
      return;
    }
  }
}

function _addSs(src) {
  if (!_ssCurrentId) return;
  const s = getState(_ssCurrentId);
  if (!s.screenshots) s.screenshots = [];
  s.screenshots.push(src);
  setState(_ssCurrentId, { screenshots: s.screenshots });
  _refreshGrid();
}

function _removeSs(idx) {
  if (!_ssCurrentId) return;
  const s = getState(_ssCurrentId);
  if (!s.screenshots) return;
  s.screenshots.splice(idx, 1);
  setState(_ssCurrentId, { screenshots: s.screenshots });
  _refreshGrid();
}

function _refreshGrid() {
  const grid = document.getElementById('ssGrid');
  if (!grid || !_ssCurrentId) return;
  const s = getState(_ssCurrentId);
  if (!s.screenshots || s.screenshots.length === 0) {
    grid.innerHTML = '<div style="color:var(--gray);font-size:13px;padding:20px;text-align:center;width:100%">暂无截图，粘贴或选择文件上传</div>';
    return;
  }
  grid.innerHTML = s.screenshots.map((src, i) =>
    `<div class="ss-item" onclick="event.stopPropagation();openPreview('${src}')">
      <span class="ss-del" onclick="event.stopPropagation();_removeSs(${i})">✕</span>
      <img src="${src}">
    </div>`
  ).join('');
}

function closeSsModal() {
  document.removeEventListener('paste', _ssPasteHandler);
  const m = document.getElementById('ssModal');
  if (m) m.remove();
  _ssCurrentId = null;
  renderAll();
}

function renderScreenshots(id) {
  // Rendered inside modal only; inline shows count via button text
}

function setFilter(mode) {
  filterMode = mode;
  renderAll();
}

function resetAll() {
  if (!confirm('确定重置所有测试状态？这将清除所有测试结果、备注和截图。')) return;
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  renderAll();
}

// ==================== 截图预览弹窗 ====================
function openPreview(src) {
  const overlay = document.createElement('div');
  overlay.className = 'preview-overlay';
  overlay.innerHTML = `<span class="preview-close" onclick="this.parentElement.remove()">✕</span><img src="${src}" onclick="event.stopPropagation()">`;
  overlay.onclick = function() { overlay.remove(); };
  overlay.setAttribute('data-preview', '1');
  document.body.appendChild(overlay);
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    const ov = document.querySelector('.preview-overlay');
    if (ov) ov.remove();
    const sm = document.getElementById('ssModal');
    if (sm) closeSsModal();
  }
});

// ==================== Init ====================// ==================== Init ====================
renderAll();

// Also expose renderScreenshots for after setState
const origSetState = setState;
setState = function(id, data) {
  const s = loadState();
  s[id] = { ...getState(id), ...data };
  saveState(s);
  renderAll();
};
</script>
