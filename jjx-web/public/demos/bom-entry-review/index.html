<style>

e:2px solid #c9ddfa;border-color:#7eabea}.num.invalid{border-color:#d95353}.wide{width:90px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}th{background:#f8fafd;font-size:12px;color:#718097;padding:13px 11px;font-weight:500}td{padding:14px 11px;border-top:1px solid #edf1f6;font-size:13px}th:first-child,td:first-child{padding-left:18px}.code{display:block;font-size:12px;color:#7788a0;font-family:ui-monospace,monospace;margin-top:4px}.number-text{font-variant-numeric:tabular-nums;color:#3d587a}.result{font-weight:600;color:#325e9a}.result.pending{font-weight:400;color:#9b7e48}.row-tools{display:flex;flex-direction:column;align-items:flex-start;gap:5px}.table-foot{padding:12px 18px;border-top:1px solid var(--line);background:#fcfdff;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.helper{padding:16px 18px;border-top:1px solid var(--line);background:#f7faff}.helper-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.helper-fields{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}.helper-fields label{font-size:12px;color:#6d7e92}.helper-fields label span{display:block;margin-bottom:6px}.helper-result{margin-top:13px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:13px}.helper-result strong{font-size:17px;color:#2e65b5}.advanced{padding:14px 18px;border-top:1px solid var(--line)}.advanced summary{cursor:pointer;font-size:13px;color:#667a94}.advanced-grid{display:flex;flex-wrap:wrap;gap:20px;margin-top:15px}.advanced-grid label{font-size:13px;color:#65758b;display:flex;align-items:center;gap:8px}.advanced p{margin:10px 0 0}.card-head{padding:14px 18px;border-bottom:1px solid var(--line)}.remark{width:100%;border:1px solid #d8e1ed;border-radius:6px;padding:10px}.footer{margin-top:20px}.dirty{color:#b47b1f}.pill{font-size:11px;background:#eef3fa;color:#6b81a1;padding:3px 7px;border-radius:4px}.bad{color:#bc5b49;font-size:12px}.empty{padding:24p </head>
<body>
<header><strong>JJX · 工程</strong><span>BOM录入精简</span><span class="pill">007效果预览</span></header>
<main id="bom-review">
<div class="review-note">页面评审稿 · 使用本地 YL1025PWOO V2 和已有制造方案展示。保存仅保留在当前页面，不写入正式单据。</div>
<nav class="crumbs" id="path"></nav>
<div class="page-title"><div><h1 id="title">正在加载预览</h1><div class="muted" id="context"></div></div><div class="actions"><button id="back" hidden>返回上层</button><button id="adopt" class="primary" hidden>采用方案并返回</button></div></div>
<section class="card"><div class="identity" id="identity"></div></section>
<section class="card">
<div class="toolbar"><h2 id="table-title">本层材料</h2><div class="actions"><label>试算产出 <input class="num wide" id="quantity" type="number" min="1" step="1" value="100" list="quantity-examples"> <span id="output-unit">PCS</span></label><label><input id="show-conversions" type="checkbox"> 显示米数／卷数</label><button id="add-material">添加材料</button></div></div>
<datalist id="quantity-examples"><option value="1"><option value="100"><option value="160"><option value="300"></datalist>
<div class="scroll"><table><thead id="columns"></thead><tbody id="rows"></tbody></table></div>
<div id="pitch-helper" class="helper" hidden></div>
<details class="advanced" id="advanced"><summary>高级设置 <span id="advanced-summary"></span></summary><div class="advanced-grid" id="advanced-fields"></div><p class="muted">最低投料参与总需求下限；参考卷长只用于估算卷数，实际发料以所选整卷或余卷为准。</p></details>
<div class="table-foot"><span class="muted">每件用量不含损耗；总需求含损耗及最低投料，按本页单位与比例试算。</span><span id="save-state" class="muted"></span></div>
</section>
<div class="muted" id="sample-note">本页演示试算支持1／100／160／300件及常用比例；未收录的输入显示“待试算”，不沿用旧结果。</div>
<section class="card" style="margin-top:18px"><div class="card-head"><h2>备注</h2></div><div style="padding:16px 18px"><input id="remark" class="remark" placeholder="填写本层备注"></div></section>
<div class="footer"><span class="muted" id="boundary"></span><div class="actions"><button id="cancel">取消本层修改</button><button id="save" class="primary">保存本层草稿</button></div></div>
</main>
<dialog id="chooser"><div class="modal-head"><strong id="choice-title">选择制造方案</strong><button id="close-choice" class="link">关闭</button></div><div class="modal-body"><p class="muted">进入后只维护这一层；采用回填上层草稿，上层保存后才保留引用。</p><div id="choices"></div></div><div class="modal-footer"><button id="new-scheme">新建方案</button><button id="open-scheme" class="primary">进入本层维护</button></div></dialog>
<dialog id="material-chooser"><div class="modal-head"><strong>选择物料</strong><button id="close-materials" class="link">关闭</button></div><div class="modal-body"><div id="material-options"></div></div></dialog>
<div id="toast" role="status"></div>
<script type="module" src="./entry-preview.mjs"></script>
</body></html>
