# Spring DevTools 类加载器配置
# 将 domain/vo/dto/enums 等数据类放在基类加载器，避免 DevTools 重启时
# ClassLoader 不一致导致的 ClassCastException
# 格式: restart.exclude.<name>=<regex pattern>
# pattern 匹配 classpath 资源路径，例如 com/jjx/system/domain/vo/LoginUser.class

restart.exclude.domain=/com/jjx/.*/domain/.*
restart.exclude.vo=/com/jjx/.*/vo/.*
restart.exclude.dto=/com/jjx/.*/dto/.*
restart.exclude.enums=/com/jjx/.*/enums/.*
restart.exclude.converter=/com/jjx/.*/converter/.*
