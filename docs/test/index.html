<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERP 测试工作台 v2.0</title>
<!-- SortableJS -->
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --sidebar-w: 240px;
  --primary: #1a73e8;
  --success: #34a853;
  --danger: #ea4335;
  --warning: #fbbc04;
  --gray: #5f6368;
  --bg: #f8f9fa;
  --card-bg: #fff;
  --border: #dadce0;
  --new: #9334e6;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: #202124;
  height: 100vh;
  overflow: hidden;
}

/* Header */
.header {
  background: var(--primary);
  color: #fff;
  padding: 12px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  height: 52px;
}
.header h1 { font-size: 18px; font-weight: 600; }
.header .version { font-size: 11px; opacity: .65; background: rgba(255,255,255,.15); padding: 2px 8px; border-radius: 8px; }
.header .stats { font-size: 13px; opacity: .85; margin-left: auto; }

/* Layout */
.layout { display: flex; height: calc(100vh - 52px); }

/* Sidebar */
.sidebar {
  width: var(--sidebar-w);
  background: var(--card-bg);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  flex-shrink: 0;
}
.sidebar .section-title {
  padding: 14px 16px 6px;
  font-size: 11px;
  font-weight: 600;
  color: var(--gray);
  text-transform: uppercase;
  letter-spacing: .5px;
}
.module-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  cursor: pointer;
  font-size: 13px;
  border-left: 3px solid transparent;
  transition: all .15s;
}
.module-item:hover { background: #f1f3f4; }
.module-item.active {
  background: #e8f0fe;
  border-left-color: var(--primary);
  color: var(--primary);
  font-weight: 500;
}
.module-item .badge {
  margin-left: auto;
  font-size: 11px;
  padding: 1px 7px;
  border-radius: 10px;
  background: #f1f3f4;
  color: var(--gray);
  white-space: nowrap;
}
.module-item .badge.pass { background: #e6f4ea; color: #1e7e34; }
.module-item .badge.fail { background: #fce8e6; color: #c5221f; }
.module-item .badge.partial { background: #fef7e0; color: #b06000; }
.module-item .code-badge {
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 8px;
  margin-right: 2px;
}
.module-item .code-badge.existing { background: #e6f4ea; color: #1e7e34; }
.module-item .code-badge.new { background: #f3e8fd; color: #7c3aed; }
.module-item .code-badge.partial { background: #fef7e0; color: #b06000; }

/* Main content */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Toolbar */
.toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 24px;
  background: var(--card-bg);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.toolbar .module-title { font-size: 16px; font-weight: 600; }
.toolbar .module-desc { font-size: 12px; color: var(--gray); margin-left: 8px; }
.toolbar .code-status {
  font-size: 11px;
  padding: 2px 10px;
  border-radius: 8px;
  margin-left: 8px;
}
.toolbar .code-status.existing { background: #e6f4ea; color: #1e7e34; }
.toolbar .code-status.new { background: #f3e8fd; color: #7c3aed; }
.toolbar .code-status.partial { background: #fef7e0; color: #b06000; }
.filter-btn {
  padding: 5px 14px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: #fff;
  cursor: pointer;
  font-size: 12px;
  transition: all .15s;
}
.filter-btn:hover { background: #f1f3f4; }
.filter-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.filter-btn.pass-count { color: var(--gray); margin-left: auto; cursor: default; border: none; }

/* Case list */
.case-list {
  flex: 1;
  overflow-y: auto;
  padding: 16px 24px 80px;
}

/* Case card */
.case-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
  margin-bottom: 8px;
  cursor: grab;
  transition: box-shadow .15s;
}
.case-card:hover { box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.case-card:active { cursor: grabbing; }
.case-card.sortable-chosen { box-shadow: 0 4px 12px rgba(0,0,0,.12); }
.case-card.sortable-ghost { opacity: .4; }

.case-header {
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.case-id {
  font-size: 11px;
  font-weight: 600;
  color: var(--gray);
  background: #f1f3f4;
  padding: 2px 8px;
  border-radius: 4px;
  white-space: nowrap;
  margin-top: 1px;
}
.case-title {
  font-size: 14px;
  font-weight: 500;
  flex: 1;
}
.case-status {
  font-size: 11px;
  padding: 2px 10px;
  border-radius: 10px;
  white-space: nowrap;
}
.case-status.todo { background: #f1f3f4; color: var(--gray); }
.case-status.pass { background: #e6f4ea; color: #1e7e34; }
.case-status.fail { background: #fce8e6; color: #c5221f; }
.case-status.blocked { background: #fef7e0; color: #b06000; }

/* Code status tag on case card */
.code-tag {
  font-size: 10px;
  padding: 1px 7px;
  border-radius: 8px;
  margin-left: 8px;
  white-space: nowrap;
}
.code-tag.existing { background: #e6f4ea; color: #1e7e34; }
.code-tag.new { background: #f3e8fd; color: #7c3aed; }
.code-tag.partial { background: #fef7e0; color: #b06000; }

/* Case details (collapsible) */
.case-details {
  display: none;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}
.case-card.expanded .case-details { display: block; }
.detail-row { font-size: 13px; margin-bottom: 6px; color: #444; }
.detail-row strong { color: #202124; }
.detail-row pre {
  display: inline;
  font-family: inherit;
  color: #444;
}

/* Actions */
.case-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
  flex-wrap: wrap;
}
.btn {
  padding: 5px 14px;
  border: none;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
  transition: all .15s;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: #1557b0; }
.btn-success { background: var(--success); color: #fff; }
.btn-success:hover { background: #2d8f47; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { background: #b3261e; }
.btn-warning { background: var(--warning); color: #202124; }
.btn-warning:hover { background: #e6a800; }
.btn-outline { background: #fff; border: 1px solid var(--border); color: var(--gray); }
.btn-outline:hover { background: #f1f3f4; }
.btn-sm { padding: 3px 10px; font-size: 11px; }

.screenshot-area {
  display: flex;
  align-items: center;
  gap: 6px;
}
.screenshot-area input[type="file"] { display: none; }
.screenshot-area label {
  padding: 3px 10px;
  font-size: 11px;
  background: #fff;
  border: 1px dashed var(--border);
  border-radius: 4px;
  cursor: pointer;
  color: var(--gray);
}
.screenshot-area label:hover { border-color: var(--primary); color: var(--primary); }
.screenshot-preview { width: 40px; height: 30px; border-radius: 3px; object-fit: cover; border: 1px solid var(--border); }

.notes-input {
  font-size: 12px;
  padding: 3px 8px;
  border: 1px solid var(--border);
  border-radius: 4px;
  width: 160px;
  outline: none;
}
.notes-input:focus { border-color: var(--primary); }

.dep-warn {
  font-size: 11px;
  color: var(--danger);
  background: #fce8e6;
  padding: 3px 10px;
  border-radius: 4px;
  margin-top: 4px;
}

/* Report panel */
.report-panel {
  position: fixed;
  bottom: 0;
  left: var(--sidebar-w);
  right: 0;
  background: var(--card-bg);
  border-top: 1px solid var(--border);
  padding: 8px 24px;
  display: flex;
  align-items: center;
  gap: 20px;
  font-size: 12px;
  z-index: 10;
}
.report-panel .stat-item { display: flex; align-items: center; gap: 4px; }
.report-panel .stat-dot { width: 8px; height: 8px; border-radius: 50%; }
.report-panel .reset-btn {
  margin-left: auto;
  padding: 3px 12px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: #fff;
  cursor: pointer;
  font-size: 11px;
  color: var(--gray);
}
.report-panel .reset-btn:hover { background: #f1f3f4; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #aaa; }

@media (max-width: 768px) {
  .sidebar { display: none; }
  .report-panel { left: 0; }
}
</style>
</head>
<body>

<div class="header">
  <h1>🧪 ERP 测试工作台</h1>
  <span class="version">v2.0</span>
  <div class="stats" id="headerStats">加载中...</div>
</div>

<div class="layout">
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar"></div>

  <!-- Main -->
  <div class="main">
    <div class="toolbar" id="toolbar"></div>
    <div class="case-list" id="caseList"></div>
  </div>
</div>

<div class="report-panel" id="reportPanel">
  <div class="stat-item"><span class="stat-dot" style="background:#f1f3f4"></span> 待测: <strong id="statTodo">0</strong></div>
  <div class="stat-item"><span class="stat-dot" style="background:#34a853"></span> 通过: <strong id="statPass">0</strong></div>

  <div class="stat-item"><span class="stat-dot" style="background:#fbbc04"></span> 阻塞: <strong id="statBlocked">0</strong></div>

  <button class="reset-btn" onclick="resetAll()">🔄 重置所有状态</button>
</div>

// ==================== 状态管理 ====================
const STATUSES = { TODO: 'todo', PASS: 'pass', FAIL: 'fail', BLOCKED: 'blocked' };
const STORAGE_KEY = 'erp_test_state_v2';
const ORDER_KEY = 'erp_test_order_v2';

function loadState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; }
}
function saveState(state) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function loadOrder() {
  try { return JSON.parse(localStorage.getItem(ORDER_KEY)) || {}; } catch { return {}; }
}
function saveOrder(order) {
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
}

function getState(id) {
  const s = loadState();
  return s[id] || { status: STATUSES.TODO, notes: '', screenshots: [] };
}

function setState(id, data) {
  const s = loadState();
  s[id] = { ...getState(id), ...data };
  saveState(s);
  renderAll();
}

// ==================== 渲染 ====================
let currentModule = 0;
let filterMode = 'all';

function getCasesForModule(mi) {
  const order = loadOrder();
  const mod = MODULES[mi];
  const key = mod.id;
  if (order[key] && Array.isArray(order[key])) {
    return order[key].map(id => mod.cases.find(c => c.id === id)).filter(Boolean);
  }
  return [...mod.cases];
}

function renderSidebar() {
  const el = document.getElementById('sidebar');
  let html = '<div class="section-title">📋 测试模块</div>';
  MODULES.forEach((mod, i) => {
    const state = loadState();
    const done = mod.cases.filter(c => (state[c.id]?.status) === STATUSES.PASS).length;
    const total = mod.cases.length;
    const active = i === currentModule ? 'active' : '';
    let badgeClass = '';
    if (done === total && total > 0) badgeClass = 'pass';
    else if (done > 0) badgeClass = 'partial';
    if (done === 0) badgeClass = '';

    let codeBadgeHtml = '';
    if (mod.codeStatus === 'new') {
      codeBadgeHtml = '<span class="code-badge new">🆕</span>';
    } else if (mod.codeStatus === 'existing') {
      codeBadgeHtml = '<span class="code-badge existing">✅</span>';
    } else if (mod.codeStatus === 'partial') {
      codeBadgeHtml = '<span class="code-badge partial">⚠️</span>';
    }

    html += `<div class="module-item ${active}" onclick="switchModule(${i})">
      <span>${done === total ? '✅' : done > 0 ? '⏳' : '⬜'}</span>
      ${codeBadgeHtml}
      <span>${mod.name}</span>
      <span class="badge ${badgeClass}">${done}/${total}</span>
    </div>`;
  });
  el.innerHTML = html;
}

function switchModule(i) {
  currentModule = i;
  filterMode = 'all';
  renderAll();
}

function renderToolbar() {
  const mod = MODULES[currentModule];
  const el = document.getElementById('toolbar');
  const cases = getCasesForModule(currentModule);
  const state = loadState();
  const all = cases.length;
  const pass = cases.filter(c => state[c.id]?.status === STATUSES.PASS).length;

  let codeStatusHtml = '';
  const codeLabel = { 'new': '🆕 新模块', 'existing': '✅ 已有', 'partial': '⚠️ 部分待开发' };
  if (mod.codeStatus) {
    codeStatusHtml = `<span class="code-status ${mod.codeStatus}">${codeLabel[mod.codeStatus]}</span>`;
  }

  el.innerHTML = `
    <span class="module-title">${mod.name}</span>
    <span class="module-desc">${mod.desc}</span>
    ${codeStatusHtml}
    <span style="flex:1"></span>
    <button class="filter-btn ${filterMode === 'all' ? 'active' : ''}" onclick="setFilter('all')">全部 (${all})</button>
    <button class="filter-btn ${filterMode === 'todo' ? 'active' : ''}" onclick="setFilter('todo')">待测</button>
    <button class="filter-btn ${filterMode === 'pass' ? 'active' : ''}" onclick="setFilter('pass')">通过 (${pass})</button>
    <button class="filter-btn ${filterMode === 'fail' ? 'active' : ''}" onclick="setFilter('fail')">失败</button>
    <button class="filter-btn ${filterMode === 'blocked' ? 'active' : ''}" onclick="setFilter('blocked')">阻塞</button>
  `;
}

function renderCaseList() {
  const mod = MODULES[currentModule];
  const el = document.getElementById('caseList');
  const cases = getCasesForModule(currentModule);
  const state = loadState();
  const deps = mod.deps || [];

  // Check dependency warnings
  const depWarnings = [];
  deps.forEach(depId => {
    const depMod = MODULES.find(m => m.id === depId);
    if (depMod) {
      const allDepPass = depMod.cases.every(c => state[c.id]?.status === STATUSES.PASS);
      if (!allDepPass) {
        depWarnings.push(`⚠️ 前置模块 "${depMod.name}" 尚有未通过的用例`);
      }
    }
  });

  let filtered = cases;
  if (filterMode !== 'all') {
    filtered = cases.filter(c => (state[c.id]?.status || STATUSES.TODO) === filterMode);
  }

  let html = '';

  if (depWarnings.length > 0) {
    html = depWarnings.map(w => `<div class="dep-warn" style="margin-bottom:8px">${w}</div>`).join('');
  }

  if (filtered.length === 0) {
    html += '<div style="text-align:center;padding:40px;color:var(--gray)">没有匹配的用例</div>';
    el.innerHTML = html;
    return;
  }

  html += `<div id="sortableList">`;
  const codeLabel = { 'new': '🆕需开发', 'existing': '✅已有', 'partial': '⚠️待完善' };
  filtered.forEach(c => {
    const s = state[c.id] || { status: STATUSES.TODO, notes: '', screenshots: [] };
    const statusLabel = { todo: '待测', pass: '通过', fail: '失败', blocked: '阻塞' };
    const exp = c.expect || '';

    let codeTagHtml = '';
    if (c.codeStatus && c.codeStatus !== 'existing') {
      codeTagHtml = `<span class="code-tag ${c.codeStatus}">${codeLabel[c.codeStatus]}</span>`;
    }

    html += `
      <div class="case-card" data-id="${c.id}" onclick="toggleExpand(event, ${c.id})">
        <div class="case-header">
          <span class="case-id">#${c.id}</span>
          <span class="case-title">${c.title}${codeTagHtml}</span>
          <span class="case-status ${s.status}">${statusLabel[s.status] || '待测'}</span>
        </div>
        <div class="case-details">
          <div class="detail-row"><strong>前置条件：</strong>${c.pre || '-'}</div>
          <div class="detail-row"><strong>操作步骤：</strong>${c.steps || '-'}</div>
          <div class="detail-row"><strong>预期结果：</strong><pre>${exp}</pre></div>
          <div class="case-actions">
            <button class="btn btn-success btn-sm" onclick="event.stopPropagation();setStatus(${c.id},'pass')">✅ 通过</button>
            <button class="btn btn-danger btn-sm" onclick="event.stopPropagation();setStatus(${c.id},'fail')">❌ 失败</button>
            <button class="btn btn-warning btn-sm" onclick="event.stopPropagation();setStatus(${c.id},'blocked')">⛔ 阻塞</button>
            <button class="btn btn-outline btn-sm" onclick="event.stopPropagation();setStatus(${c.id},'todo')">↩ 待测</button>
            <div class="screenshot-area">
              <label onclick="event.stopPropagation()">📷 截图 <input type="file" accept="image/*" onchange="handleScreenshot(event,${c.id})"></label>
              <div id="ss-${c.id}"></div>
            </div>
            <input class="notes-input" placeholder="备注..." value="${s.notes || ''}" onchange="event.stopPropagation();setNotes(${c.id},this.value)" onclick="event.stopPropagation()">
          </div>
        </div>
      </div>`;
  });
  html += `</div>`;
  el.innerHTML = html;

  // Init sortable
  const sortableEl = document.getElementById('sortableList');
  if (sortableEl) {
    Sortable.create(sortableEl, {
      animation: 150,
      handle: '.case-card',
      onEnd: function(evt) {
        const items = Array.from(evt.from.children).map(el => parseInt(el.dataset.id));
        const order = loadOrder();
        order[MODULES[currentModule].id] = items;
        saveOrder(order);
      }
    });
  }

  // Render screenshots for all visible cards
  filtered.forEach(c => {
    renderScreenshots(c.id);
  });
}

function renderStats() {
  const state = loadState();
  let todo = 0, pass = 0, fail = 0, blocked = 0;
  MODULES.forEach(m => m.cases.forEach(c => {
    const s = state[c.id] || { status: STATUSES.TODO };
    if (s.status === STATUSES.PASS) pass++;
    else if (s.status === STATUSES.FAIL) fail++;
    else if (s.status === STATUSES.BLOCKED) blocked++;
    else todo++;
  }));
  const total = todo+pass+fail+blocked;
  const rate = total > 0 ? Math.round(pass/total*100) : 0;
  document.getElementById('statTodo').textContent = todo;
  document.getElementById('statPass').textContent = pass;
  document.getElementById('statFail').textContent = fail;
  document.getElementById('statBlocked').textContent = blocked;
  document.getElementById('statRate').textContent = rate + '%';
  document.getElementById('headerStats').textContent = `通过 ${pass}/${total} · 通过率 ${rate}%`;
}

function renderAll() {
  renderSidebar();
  renderToolbar();
  renderCaseList();
  renderStats();
}

// ==================== 操作函数 ====================
function toggleExpand(e, id) {
  const card = e.currentTarget;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target.tagName === 'LABEL') return;
  card.classList.toggle('expanded');
}

function setStatus(id, status) {
  setState(id, { status });
  renderAll();
}

function setNotes(id, notes) {
  setState(id, { notes });
}

function handleScreenshot(e, id) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    const s = getState(id);
    if (!s.screenshots) s.screenshots = [];
    s.screenshots.push(ev.target.result);
    setState(id, { screenshots: s.screenshots });
    renderScreenshots(id);
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

function renderScreenshots(id) {
  const s = getState(id);
  const container = document.getElementById(`ss-${id}`);
  if (!container) return;
  if (s.screenshots && s.screenshots.length > 0) {
    container.innerHTML = s.screenshots.map((ss, i) =>
      `<img class="screenshot-preview" src="${ss}" title="截图${i+1}" onclick="event.stopPropagation();window.open('${ss}')">`
    ).join('');
  } else {
    container.innerHTML = '';
  }
}

function setFilter(mode) {
  filterMode = mode;
  renderAll();
}

function resetAll() {
  if (!confirm('确定重置所有测试状态？这将清除所有测试结果、备注和截图。')) return;
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  renderAll();
}

// ==================== Init ====================
renderAll();

// Also expose renderScreenshots for after setState
const origSetState = setState;
setState = function(id, data) {
  const s = loadState();
  s[id] = { ...getState(id), ...data };
  saveState(s);
  renderAll();
};
</script>
</body>
